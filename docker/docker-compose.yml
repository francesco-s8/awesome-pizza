services:

  rabbitmq:
    image: rabbitmq:4.2.6-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - "${VOLUME_PATH}/rabbitmq-data:/var/lib/rabbitmq"
      - "${VOLUME_PATH}/rabbitmq-log:/var/log/rabbitmq"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  postgres:
    image: postgres:18-alpine
    container_name: postgresql-18
    ports:
      - "5432:5432"
    volumes:
      - "${VOLUME_PATH}/postgres-18-data:/var/lib/postgresql/18/docker"
    environment:
      - POSTGRES_PASSWORD=s8
      - POSTGRES_USER=s8
      - POSTGRES_DB=awesome_pizza
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  awesome-pizza:
    image: awesome-pizza-s8
    container_name: awesome-pizza-s8
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=awesome_pizza
      - POSTGRES_USER=s8
      - POSTGRES_PASS=s8
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
      - LOGGING_FILE_NAME=/app/logs/spring.log
      - AOT_MODE=use
    volumes:
      - "${VOLUME_PATH}/spring-logs:/app/logs"
      - aot-cache:/application/aot-cache

volumes:
  aot-cache:
