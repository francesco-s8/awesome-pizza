spring.main.banner-mode=off
spring.application.name=AWESOME-PIZZA
spring.threads.virtual.enabled=true

logging.level.org.springframework=INFO
logging.level.org.flywaydb=INFO

spring.datasource.url=jdbc:postgresql://localhost:5432/awesome_pizza?autoReconnect=true&useSSL=false
spring.datasource.username=s8
spring.datasource.password=s8
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.id.new_generator_mappings=true
spring.jpa.properties.hibernate.jdbc.sequence_batch_size=50
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest