openapi: 3.1.0
info:
  title: Awesome pizza order
  version: "1.0"
  description: "Available operations on the Awesome pizza order service endpoint"
servers:
  - url: http://localhost:8080
tags:
  - name: order
    description: Everything about pizza orders
paths:
  /api/awesome-pizza/orders:
    post:
      tags:
        - order
      summary: Process a pizza order
      description: Process a pizza order. The request contains the details of the order, including the list of documents to be analyzed and the callback URL to send the response to. The response will contain the request id for the analysis to be used in this service's subsequent operations.
      operationId: newOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PizzaOrderRequest'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PizzaOrderResponse'
        '500':
          description: Internal error
  /api/awesome-pizza/orders/{orderId}/status:
    get:
      tags:
        - order
      summary: Return the order status
      description: Returns the status of a specific pizza order.
      operationId: getOrderStatus
      parameters:
        - in: path
          name: orderId
          schema:
            type: integer
            format: int64
          description: The unique identifier for the pizza order
          example: 1
          required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PizzaOrderStatus'
        '404':
          description: No order found
        '500':
          description: Internal error
  /api/awesome-pizza/menu:
    get:
      tags:
        - menu
      summary: Return the menu of available pizzas
      description: Returns the list of all available pizzas.
      operationId: getMenu
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PizzaMenu'
        '500':
          description: Application error

  /api/awesome-pizza/orders/{orderId}/total:
    get:
      tags:
        - payment
      summary: Calculate the total for a pizza order
      description: Calculates the total cost for a specific pizza order.
      operationId: calculateOrderTotal
      parameters:
        - in: path
          name: orderId
          schema:
            type: integer
            format: int64
          description: The unique identifier for the pizza order
          example: 1
          required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PizzaOrderTotalToPay'
        '404':
          description: No order found
        '500':
          description: Internal error
  /api/awesome-pizza/orders/{orderId}/payment:
    put:
      tags:
        - payment
      summary: Mark an order as paid
      description: Marks a specific pizza order as paid.
      operationId: markOrderAsPaid
      parameters:
        - in: path
          name: orderId
          schema:
            type: integer
            format: int64
          description: The unique identifier for the pizza order
          example: 1
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PizzaOrderPaymentInfo'
        required: true
      responses:
        '200':
          description: Successful operation
        '404':
          description: No order found
        '500':
          description: Internal error
components:
  schemas:
    PizzaOrderStatus:
      type: object
      properties:
        orderStatus:
          type: string
          enum:
            - 'IN_PROCESS'
            - 'READY_FOR_DELIVERY'
            - 'TO_BE_PAID'
            - 'PAID'
            - 'ALREADY DELIVERED'
          description: The status of the pizza order
          examples:
            - 'IN_PROCESS'
    PizzaOrderRequest:
      type: object
      properties:
        customerName:
          type: string
          minLength: 4
          nullable: false
          description: The name of the user placing the order
          examples:
            - "John Doe"
        pizzas:
          type: array
          minItems: 1
          description: A list of pizzas to be ordered
          items:
            type: string
            description: The name of the pizza
            examples:
              - "Margherita"
      required:
        - customerName
        - pizzas

    PizzaOrderResponse:
      type: object
      properties:
        orderId:
          type: integer
          format: int64
          description: The unique identifier for the pizza order
          examples:
            - 1
    PizzaMenu:
      type: object
      properties:
        menu:
          type: array
          description: A list of available pizzas
          items:
            $ref: '#/components/schemas/PizzaDto'
    PizzaDto:
      type: object
      properties:
        name:
          type: string
          description: The name of the pizza
          examples:
            - "Margherita"
        description:
          type: string
          description: A brief description of the pizza
          examples:
            - "A classic Italian pizza with tomato sauce and mozzarella"
        price:
          type: number
          description: The price of the pizza with 2 decimal places
          examples:
            - 5.5
    PizzaOrderTotalToPay:
      type: object
      properties:
        order:
          type: integer
          format: int64
          description: The unique identifier for the pizza order
          examples:
            - 1
        name:
          type: string
          description: The name of the guy who ordered
        total:
          type: string
          description: The total cost of the pizza order
          examples:
            - "15.50 €"
    PizzaOrderPaymentInfo:
      type: object
      properties:
        total:
          type: number
          description: "The amount to pay"
          examples:
            - "10,00"
        paymentMethod:
          type: string
          enum:
            - 'CASH'
            - 'CREDIT_CARD'
            - 'DEBIT_CARD'

          description: The payment method used for the pizza order
          examples:
            - 'CASH'
      required:
        - paymentMethod
        - total